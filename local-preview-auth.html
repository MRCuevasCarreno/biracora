<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bitácora Mecánica — Acceso</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1d2b37;
    --muted: #74818b;
    --line: #e6eaed;
    --paper: #ffffff;
    --canvas: #f4f6f7;
    --navy: #183548;
    --teal: #167b72;
    --teal-pale: #e9f5f2;
    --amber: #7d5411;
    --amber-pale: #fff5dc;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    color: var(--ink);
    background: var(--canvas);
    font: 14px/1.5 Arial, Helvetica, sans-serif;
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  .app-header {
    height: 74px;
    padding: 0 38px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
  .brand-mark {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--navy);
    color: white;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .04em;
  }
  .brand-copy { display: grid; line-height: 1.25; }
  .brand-copy strong { font-size: 15px; }
  .brand-copy span { margin-top: 3px; color: var(--muted); font-size: 12px; }
  .header-right, .profile-chip { display: flex; align-items: center; }
  .header-right { gap: 22px; }
  .demo-user { display: flex; align-items: center; gap: 9px; color: #53616b; }
  .demo-user-copy { display: grid; line-height: 1.25; }
  .demo-user-copy strong { font-size: 11px; }
  .demo-user-copy small { margin-top: 3px; color: #8a969d; font-size: 9px; }
  .demo-user select { max-width: 154px; padding: 6px 24px 6px 8px; border: 1px solid #dfe5e7; border-radius: 7px; background: white; color: #52616b; font-size: 10px; }
  .demo-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 10px;
    border: 1px solid #f0dfb6;
    border-radius: 999px;
    color: var(--amber);
    background: var(--amber-pale);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .04em;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #d29a31; }
  .profile-chip { gap: 9px; color: #53616b; font-size: 12px; font-weight: 700; }
  .profile-avatar {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #edf1f3;
    color: #51616c;
    font-size: 10px;
    font-weight: 800;
  }
  main { max-width: 1440px; margin: 0 auto; padding: 24px 32px 40px; }
  .security-banner {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 14px 17px;
    border: 1px solid #ecd7a8;
    border-radius: 10px;
    background: #fff9eb;
    color: #60491e;
  }
  .banner-icon {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border: 1px solid #dcb967;
    border-radius: 50%;
    font-weight: 800;
  }
  .security-banner strong { font-size: 12px; }
  .security-banner p { margin: 2px 0 0; color: #786642; font-size: 12px; }
  .workspace { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 22px; margin-top: 20px; align-items: start; }
  .workspace.page-focus { grid-template-columns: minmax(0, 1fr); }
  .workspace.page-focus .jobs-panel { display: none; }
  .jobs-panel, .detail-panel { min-width: 0; }
  .jobs-panel {
    min-height: 710px;
    padding: 21px 18px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
  }
  .panel-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 23px; }
  .eyebrow { margin: 0 0 5px; color: #84919a; font-size: 10px; font-weight: 800; letter-spacing: .09em; }
  .panel-heading h1 { margin: 0; font-size: 21px; letter-spacing: -.03em; }
  .count-badge { min-width: 28px; padding: 4px 8px; border-radius: 999px; background: #eef2f4; color: #66747e; text-align: center; font-size: 11px; font-weight: 800; }
  .search-label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 700; }
  .search-box { position: relative; }
  .search-box svg {
    position: absolute;
    top: 11px;
    left: 11px;
    width: 17px;
    height: 17px;
    fill: none;
    stroke: #8d99a1;
    stroke-linecap: round;
    stroke-width: 1.8;
  }
  .search-box input {
    width: 100%;
    height: 40px;
    padding: 0 36px;
    border: 1px solid #dce2e5;
    border-radius: 7px;
    outline: none;
    background: white;
    color: var(--ink);
  }
  .search-box input:focus { border-color: #81b9b1; box-shadow: 0 0 0 3px #e8f4f1; }
  .search-box input::placeholder { color: #a4adb3; }
  .clear-search { position: absolute; top: 6px; right: 7px; width: 28px; height: 28px; border: 0; background: transparent; color: #78858d; font-size: 20px; }
  .hint { margin: 7px 0 16px; color: #818d95; font-size: 10px; }
  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 36px;
    padding: 0 12px;
    border: 1px solid transparent;
    border-radius: 7px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }
  .button-primary { background: var(--teal); color: white; }
  .button-primary:hover:not(:disabled) { background: #126a63; }
  .button-light { border-color: #e0e5e8; background: white; color: #52616b; }
  .button-danger { border-color: #f0dddd; background: #fff; color: #a55757; }
  .button:disabled { opacity: .48; }
  .new-job { width: 100%; }
  .new-job span { font-size: 17px; line-height: 1; }
  .disabled-note { margin: 7px 0 22px; color: #909ba2; font-size: 10px; text-align: center; }
  .list-heading { display: flex; justify-content: space-between; padding: 0 2px 9px; border-bottom: 1px solid #edf0f2; color: #8b969d; font-size: 9px; font-weight: 800; letter-spacing: .08em; }
  .jobs-list { display: grid; gap: 7px; padding-top: 8px; }
  .job-item {
    width: 100%;
    padding: 11px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    text-align: left;
  }
  .job-item:hover { background: #f6f8f8; }
  .job-item.selected { border-color: #c9e2dd; background: #f0f8f6; }
  .job-item-top, .job-item-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .job-plate { font-size: 13px; font-weight: 800; letter-spacing: .045em; }
  .job-date { color: #849099; font-size: 10px; }
  .job-owner { display: block; margin-top: 5px; overflow: hidden; color: #52616b; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .job-vehicle { margin-top: 3px; color: #909aa1; font-size: 10px; }
  .empty-state, .initial-state { padding: 24px 10px; color: #89949b; text-align: center; }
  .empty-state { display: grid; justify-items: center; gap: 7px; }
  .empty-state[hidden], .initial-state[hidden] { display: none; }
  .empty-state strong { color: #53616b; font-size: 12px; }
  .empty-state span:last-child, .initial-state { font-size: 11px; }
  .empty-icon { color: #9aa5ab; font-size: 26px; }
  .history-section { margin: 20px 0 4px; }
  .history-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
  .history-heading h2 { margin: 0; font-size: 17px; }
  .history-list { display: grid; gap: 8px; }
  .history-item { width: 100%; padding: 12px 14px; border: 1px solid #e8edef; border-radius: 9px; background: #fff; color: var(--ink); text-align: left; }
  .history-item:hover { border-color: #b9d8d2; background: #f7fbfa; }
  .history-item:focus-visible { outline: 3px solid #b9d8d2; outline-offset: 2px; }
  .history-item-meta { display: flex; justify-content: space-between; gap: 12px; color: #697780; font-size: 10px; }
  .history-item-meta strong { color: var(--teal); font-size: 11px; }
  .history-item-summary { display: block; margin-top: 6px; font-size: 12px; font-weight: 750; line-height: 1.45; }
  .history-item-mechanic { display: block; margin-top: 5px; color: #78858e; font-size: 10px; }
  .history-pagination { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; }
  .history-pagination span { min-width: 90px; color: #6f7c84; font-size: 10px; text-align: center; }
  .detail-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; padding: 4px 1px; }
  .breadcrumb { color: #89959d; font-size: 11px; }
  .breadcrumb strong { color: #52616b; }
  .crumb-divider { margin: 0 8px; color: #c0c7cb; }
  .toolbar-actions { display: flex; gap: 7px; }
  .toolbar-actions .button { min-height: 33px; }
  .print-button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
  .work-order { padding: 27px 30px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: 0 3px 14px #20384908; }
  .order-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 19px; border-bottom: 1px solid #edf0f1; }
  .order-header h2 { margin: 2px 0 3px; font-size: 19px; letter-spacing: -.03em; }
  .order-header .eyebrow { color: var(--teal); }
  .muted { margin: 0; color: #78858e; font-size: 11px; }
  .order-date { padding-top: 2px; text-align: right; }
  .order-date span, .field-label { display: block; color: #89959c; font-size: 9px; font-weight: 800; letter-spacing: .07em; }
  .order-date strong { display: block; margin-top: 5px; font-size: 12px; }
  .plate-banner { display: flex; align-items: center; gap: 15px; margin: 18px 0; padding: 15px 17px; border: 1px solid #e6ecee; border-radius: 9px; background: #fafcfc; }
  .plate-icon { display: grid; place-items: center; width: 39px; height: 39px; border-radius: 9px; background: var(--teal-pale); }
  .plate-icon svg { width: 24px; height: 24px; fill: none; stroke: var(--teal); stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.5; }
  .plate-main, .vehicle-main, .vehicle-extra { display: grid; gap: 4px; }
  .plate-main span, .vehicle-main span, .vehicle-extra span { color: #8a969d; font-size: 9px; font-weight: 800; letter-spacing: .07em; }
  .plate-main strong { font-size: 16px; letter-spacing: .08em; }
  .vehicle-main strong, .vehicle-extra strong { font-size: 11px; }
  .plate-divider { width: 1px; height: 34px; margin: 0 4px; background: #e2e8ea; }
  .vehicle-extra { margin-left: auto; text-align: right; }
  .info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 21px; }
  .info-card { min-width: 0; min-height: 62px; padding: 11px 12px; border: 1px solid #edf0f2; border-radius: 8px; }
  .info-card strong { display: block; margin-top: 5px; overflow-wrap: anywhere; font-size: 11px; }
  .work-section { margin: 18px 0; }
  .summary-section { padding: 11px 13px; border: 1px solid #e6efed; border-radius: 8px; background: #f7fbfa; }
  .work-section h3, .photos-heading h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 12px; }
  .section-icon { display: grid; place-items: center; width: 21px; height: 21px; border-radius: 6px; font-size: 12px; font-weight: 800; }
  .work-icon { background: #eef4fa; color: #46749a; }
  .supplies-icon { background: #eaf5ee; color: #398051; }
  .notes-icon { background: #f4effa; color: #8065a2; }
  .section-copy { margin: 0 0 0 29px; color: #596771; font-size: 11px; line-height: 1.7; white-space: pre-line; }
  .photos-section { margin-top: 22px; padding-top: 18px; border-top: 1px solid #edf0f2; }
  .photos-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .photos-heading h3 { margin-bottom: 3px; }
  .photos-heading p { margin: 0; color: #909aa1; font-size: 10px; }
  .photo-count { padding: 2px 6px; border-radius: 999px; background: #eef2f4; color: #687781; font-size: 9px; }
  .upload-button { min-height: 31px; font-size: 10px; }
  .photo-gallery { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
  .photo-tile { display: grid; justify-items: center; gap: 4px; }
  .photo-placeholder {
    display: grid;
    place-items: center;
    width: 82px;
    height: 61px;
    border: 1px dashed #dce4e6;
    border-radius: 7px;
    background: linear-gradient(145deg, #f3f6f6 50%, #e9eeee 50%);
    color: #9aa6ab;
    font-size: 9px;
  }
  .photo-remove { padding: 2px 5px; border: 0; background: transparent; color: #a55757; font-size: 8px; }
  .order-footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 21px; padding-top: 12px; border-top: 1px solid #edf0f2; color: #939da3; font-size: 9px; }
  .no-selection { display: grid; min-height: 450px; align-content: center; justify-items: center; padding: 24px; border: 1px dashed #dce2e5; border-radius: 12px; background: #fafbfb; text-align: center; }
  .no-selection[hidden] { display: none; }
  .no-selection-icon { color: #98a5aa; font-size: 35px; }
  .no-selection h2 { margin: 9px 0 4px; font-size: 17px; }
  .no-selection p { max-width: 270px; margin: 0; color: #849098; font-size: 11px; }
  .job-dialog { width: min(680px, calc(100% - 28px)); max-height: min(90vh, 820px); padding: 0; overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: white; color: var(--ink); box-shadow: 0 18px 60px #10253338; }
  .job-dialog::backdrop { background: #10253380; backdrop-filter: blur(2px); }
  .job-form { padding: 24px; }
  .dialog-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .dialog-heading h2 { margin: 0 0 14px; font-size: 21px; }
  .dialog-close { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; background: white; color: var(--muted); font-size: 21px; }
  .dialog-warning { margin: 0 0 17px; padding: 10px 12px; border: 1px solid #ecd7a8; border-radius: 8px; background: #fff9eb; color: #715821; font-size: 11px; }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .form-grid label { display: grid; gap: 5px; color: #53616b; font-size: 10px; font-weight: 700; }
  .form-grid input, .form-grid textarea { width: 100%; padding: 9px 10px; border: 1px solid #dce2e5; border-radius: 7px; outline: none; background: #fbfcfc; color: var(--ink); font-size: 12px; font-weight: 400; }
  .form-grid input:focus, .form-grid textarea:focus { border-color: #81b9b1; box-shadow: 0 0 0 3px #e8f4f1; }
  .form-grid textarea { resize: vertical; }
  .form-wide { grid-column: 1 / -1; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  @media (max-width: 980px) {
    main { padding: 18px 18px 30px; }
    .workspace { grid-template-columns: 270px minmax(0, 1fr); gap: 14px; }
    .jobs-panel { padding: 18px 14px; }
    .work-order { padding: 22px 20px 16px; }
    .toolbar-actions .button { padding: 0 9px; }
  }
  @media (max-width: 720px) {
    .app-header { height: auto; min-height: 64px; flex-wrap: wrap; gap: 9px; padding: 9px 12px; }
    .brand-mark { width: 36px; height: 36px; }
    .brand-copy strong { font-size: 13px; }
    .brand-copy span { font-size: 10px; }
    .header-right { width: 100%; justify-content: space-between; gap: 7px; }
    .demo-pill { max-width: 142px; white-space: normal; line-height: 1.2; }
    .demo-user { gap: 5px; }
    .demo-user-copy { display: none; }
    .demo-user select { max-width: 100px; min-width: 0; font-size: 9px; }
    .demo-pill { padding: 6px 8px; font-size: 8px; }
    main { padding: 13px 12px 24px; }
    .security-banner { padding: 11px 12px; gap: 9px; }
    .security-banner p { line-height: 1.45; }
    .workspace { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
    .workspace.page-focus { display: block; }
    .jobs-panel, .detail-panel { width: 100%; }
    .jobs-panel { min-height: 0; padding: 16px 14px; }
    .panel-heading { margin-bottom: 14px; }
    .jobs-list { grid-template-columns: 1fr; }
    .detail-toolbar { align-items: flex-start; flex-direction: column; }
    .toolbar-actions { width: 100%; }
    .toolbar-actions .button { flex: 1; }
    .work-order { padding: 18px 15px 14px; }
    .plate-banner { flex-wrap: wrap; gap: 10px; padding: 12px 10px; }
    .plate-icon { width: 34px; height: 34px; }
    .plate-main strong { font-size: 14px; }
    .vehicle-main { min-width: 0; }
    .vehicle-main strong { overflow-wrap: anywhere; }
    .order-header { align-items: flex-start; flex-direction: column; }
    .order-date { text-align: left; }
    .vehicle-extra { display: none; }
    .plate-divider { margin: 0 1px; }
    .info-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .info-card { padding: 9px 8px; }
    .info-card strong { font-size: 10px; }
    .photos-heading { align-items: flex-start; }
    .photos-heading p { max-width: 200px; }
    .order-footer { flex-direction: column; gap: 4px; }
    .job-form { padding: 18px; }
    .form-grid { grid-template-columns: 1fr; gap: 10px; }
    .form-wide { grid-column: auto; }
  }
  @media print {
    @page { margin: 14mm; }
    body { background: white; color: #111; font-size: 10pt; }
    .app-chrome, .security-banner, .jobs-panel, .detail-toolbar, .photos-section { display: none !important; }
    main { max-width: none; margin: 0; padding: 0; }
    .workspace { display: block; margin: 0; }
    .detail-panel { display: block; }
    .work-order { padding: 0; border: 0; border-radius: 0; box-shadow: none; }
    .order-header, .plate-banner, .info-card { break-inside: avoid; }
    .order-header { padding-bottom: 12px; }
    .plate-banner { background: #fafafa !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .section-copy { color: #222; font-size: 10pt; }
    .order-footer { margin-top: 24px; }
  }
  .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .auth-shell { width: min(440px, 100%); }
  .auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .auth-brand .brand-mark { flex: 0 0 auto; }
  .auth-card { padding: 28px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: 0 14px 40px rgb(22 42 54 / 8%); }
  .auth-card h1 { margin: 0 0 8px; color: var(--navy); font-size: 24px; }
  .auth-copy { margin: 0 0 22px; color: var(--muted); }
  .auth-form { display: grid; gap: 14px; }
  .auth-form label { display: grid; gap: 6px; color: #53616b; font-size: 12px; font-weight: 700; }
  .auth-form input { width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid #dfe5e7; border-radius: 7px; color: var(--ink); }
  .auth-form input:focus { outline: 2px solid rgb(22 123 114 / 24%); border-color: var(--teal); }
  .auth-form button, .auth-session button { min-height: 42px; padding: 9px 14px; border: 0; border-radius: 7px; background: var(--teal); color: white; font-weight: 700; }
  .auth-form button:disabled, .auth-session button:disabled { cursor: not-allowed; opacity: .6; }
  .auth-status { margin: 16px 0 0; padding: 11px 12px; border: 1px solid #dce5e9; border-radius: 7px; background: #f5f8f9; color: #3c515c; overflow-wrap: anywhere; }
  .auth-status[data-kind="warning"] { border-color: #ecd7a8; background: #fff9eb; color: #60491e; }
  .auth-status[data-kind="error"] { border-color: #e6b9b9; background: #fff1f1; color: #8a2929; }
  .auth-session { display: grid; gap: 12px; }
  .auth-session p { margin: 0; }
  .auth-session .auth-role { color: var(--muted); font-size: 13px; }
  @media (max-width: 520px) {
    .auth-page { padding: 16px; }
    .auth-card { padding: 22px; }
  }
</style>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <header class="auth-brand">
        <span class="brand-mark" aria-hidden="true">BM</span>
        <span class="brand-copy">
          <strong>Bitácora Mecánica</strong>
          <span>Acceso al taller</span>
        </span>
      </header>

      <section id="login-view" class="auth-card" aria-labelledby="login-heading">
        <h1 id="login-heading">Iniciar sesión</h1>
        <p class="auth-copy">Ingresa con el correo y la contraseña de tu cuenta autorizada.</p>
        <form id="login-form" class="auth-form">
          <label for="login-email">Correo electrónico
            <input id="login-email" name="email" type="email" autocomplete="username" required>
          </label>
          <label for="login-password">Contraseña
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button id="login-button" type="submit">Iniciar sesión</button>
        </form>
      </section>

      <section id="session-view" class="auth-card auth-session" aria-labelledby="session-heading" hidden>
        <h1 id="session-heading">Sesión activa</h1>
        <p id="session-email"></p>
        <p class="auth-role">Rol: <strong id="session-role"></strong></p>
        <p class="auth-copy">El rol se consulta desde el perfil autenticado; no se puede elegir en esta pantalla. La conexión de vehículos y órdenes de trabajo aún no está habilitada.</p>
        <button id="logout-button" type="button">Cerrar sesión</button>
      </section>

      <p id="auth-status" class="auth-status" role="status" aria-live="polite" hidden></p>
    </main>

    <script>
      window.BITACORA_SUPABASE_CONFIG = {
        url: "",
        publishableKey: ""
      };
    </script>
    <script>(() => {
  'use strict';

  const config = window.BITACORA_SUPABASE_CONFIG || {};
  const loginView = document.getElementById('login-view');
  const sessionView = document.getElementById('session-view');
  const loginForm = document.getElementById('login-form');
  const loginButton = document.getElementById('login-button');
  const logoutButton = document.getElementById('logout-button');
  const statusElement = document.getElementById('auth-status');
  const sessionEmail = document.getElementById('session-email');
  const sessionRole = document.getElementById('session-role');
  let supabaseClient = null;
  let sessionVersion = 0;

  function setStatus(message, kind) {
    statusElement.textContent = message;
    statusElement.dataset.kind = kind || 'info';
    statusElement.hidden = !message;
  }

  function setBusy(busy) {
    loginButton.disabled = busy || !supabaseClient;
    loginButton.textContent = busy ? 'Verificando…' : 'Iniciar sesión';
    logoutButton.disabled = busy;
  }

  function showLogin() {
    loginView.hidden = false;
    sessionView.hidden = true;
    setBusy(false);
  }

  function showSession(user, role) {
    loginForm.reset();
    sessionEmail.textContent = user.email || 'Cuenta autenticada';
    sessionRole.textContent = role === 'ADMIN' ? 'Administrador' : 'Mecánico';
    loginView.hidden = true;
    sessionView.hidden = false;
    setStatus('', 'info');
  }

  async function applySession(session) {
    const version = ++sessionVersion;
    if (!session) {
      showLogin();
      return;
    }

    loginView.hidden = true;
    sessionView.hidden = true;
    setStatus('Validando el perfil y el rol…', 'info');

    try {
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (version !== sessionVersion) return;
      if (error) throw error;
      if (!data || !['ADMIN', 'MECHANIC'].includes(data.role)) {
        throw new Error('El perfil no tiene un rol autorizado.');
      }
      showSession(session.user, data.role);
    } catch (error) {
      if (version !== sessionVersion) return;
      loginView.hidden = false;
      sessionView.hidden = true;
      setStatus(`No se pudo validar el acceso: ${error.message}`, 'error');
      let signOutError = null;
      try {
        const result = await supabaseClient.auth.signOut();
        signOutError = result.error;
      } catch (signOutFailure) {
        signOutError = signOutFailure;
      }
      if (signOutError) {
        setStatus(`No se pudo validar el acceso ni cerrar la sesión: ${signOutError.message}`, 'error');
      }
    }
  }

  if (!config.url || !config.publishableKey) {
    setStatus('Acceso bloqueado. Configura SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY en las propiedades del proyecto de Apps Script.', 'warning');
    loginButton.disabled = true;
    return;
  }

  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    setStatus('No se pudo cargar el cliente de autenticación. Revisa la conexión al CDN configurado.', 'error');
    loginButton.disabled = true;
    return;
  }

  try {
    supabaseClient = window.supabase.createClient(config.url, config.publishableKey, {
      auth: {
        autoRefreshToken: true,
        detectSessionInUrl: true,
        persistSession: true
      }
    });
  } catch (error) {
    setStatus(`No se pudo inicializar la autenticación: ${error.message}`, 'error');
    loginButton.disabled = true;
    return;
  }

  loginForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    setStatus('', 'info');
    setBusy(true);

    const email = loginForm.elements.namedItem('email').value.trim();
    const passwordField = loginForm.elements.namedItem('password');
    const password = passwordField.value;
    passwordField.value = '';
    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        setStatus(`No se pudo iniciar sesión: ${error.message}`, 'error');
        return;
      }
      await applySession(data.session);
    } catch (error) {
      setStatus(`No se pudo iniciar sesión: ${error.message}`, 'error');
    } finally {
      setBusy(false);
    }
  });

  logoutButton.addEventListener('click', async () => {
    setBusy(true);
    try {
      const { error } = await supabaseClient.auth.signOut();
      if (error) {
        setStatus(`No se pudo cerrar la sesión: ${error.message}`, 'error');
        setBusy(false);
      }
    } catch (error) {
      setStatus(`No se pudo cerrar la sesión: ${error.message}`, 'error');
      setBusy(false);
    }
  });

  supabaseClient.auth.onAuthStateChange((_event, session) => {
    window.setTimeout(() => applySession(session), 0);
  });

  supabaseClient.auth.getSession().then(({ data, error }) => {
    if (error) {
      setStatus(`No se pudo recuperar la sesión: ${error.message}`, 'error');
      return;
    }
    return applySession(data.session);
  }).catch((error) => {
    setStatus(`No se pudo recuperar la sesión: ${error.message}`, 'error');
  });
})();
</script>
  </body>
</html>
